; Isolated pytest config for the scan-gate skill test suite.
; Kept separate from the product's [tool.pytest.ini_options] (which defines
; product-specific markers and testpaths) so the meta-system suite never
; collides with the product suite. Run with:
;   python -m pytest -c .claude/skills/scan-gate/pytest.ini .claude/skills/scan-gate/tests
[pytest]
testpaths = tests
addopts = -ra --strict-config --tb=short
