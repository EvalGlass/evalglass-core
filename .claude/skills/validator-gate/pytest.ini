; Isolated pytest config for the validator-gate skill test suite.
; Kept separate from the product's [tool.pytest.ini_options] (which defines
; product-specific markers and testpaths) so this meta-system suite never
; collides with the product suite. GitHub CI runs this suite in the dedicated
; `skill-tests` job (separate invocation per skill). Run locally with:
;   python -m pytest -c .claude/skills/validator-gate/pytest.ini .claude/skills/validator-gate/tests
[pytest]
testpaths = tests
addopts = -ra --strict-config --tb=short
