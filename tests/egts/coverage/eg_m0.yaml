# EGTS coverage registry — EG-M0 (Evaluation Core).
#
# Every obligation is `covered` only because a real EGTS-M0 scenario drives the
# product's public surface (tests/egts/suites/). A row may never be `covered`
# without a real scenario id — that is an integrity violation (tests/CLAUDE.md §14).
rows:
  - product_ticket: EG-M0-1
    public_contract: "Public contracts + stable enums (TraceEnvelope, EvalUnit, Example, EvidenceBundle, MetricSpec, Evaluator, Score, ScoreBatch, Diagnostic, RunRecord, Scorecard, ComparableRunFingerprint)"
    architecture_section: "architecture_build_contract.md §9"
    status: covered
    scenario_ids: [m0.proof.runrecord_round_trips]
    checker_families: [contract, runrecord, scorecard]
    required_command: egts test-core
    negative_control: "Missing required public field or unknown enum value must fail contract checks."

  - product_ticket: EG-M0-2
    public_contract: "Score status, validity, and diagnostics"
    architecture_section: "architecture_build_contract.md §7 (scores.py)"
    status: covered
    scenario_ids: [m0.proof.score_state_blocks_on_incomplete, m0.meta.blocked_zero_rejected]
    checker_families: [scorecard, runrecord, contract]
    required_command: egts test-core
    negative_control: "A blocked or errored score encoded as zero must fail."

  - product_ticket: EG-M0-3
    public_contract: "Evaluator protocol + registry validation + deterministic built-ins"
    architecture_section: "architecture_build_contract.md §7 (evaluators.py, registry.py)"
    status: covered
    scenario_ids: [m0.proof.pass, m0.proof.fail]
    checker_families: [contract, runrecord]
    required_command: egts test-core
    negative_control: "Undeclared metric name, wrong range, missing evaluator version, or undeclared batch member must fail."

  - product_ticket: EG-M0-4
    public_contract: "Aggregation, provenance, and baseline comparability (ComparableRunFingerprint)"
    architecture_section: "architecture_build_contract.md §7 (aggregation.py, provenance.py)"
    status: covered
    scenario_ids: [m0.proof.score_state_blocks_on_incomplete, m0.proof.comparability]
    checker_families: [provenance, scorecard, authority]
    required_command: egts test-core
    negative_control: "A score delta without a comparable fingerprint must fail regression proof."

  - product_ticket: EG-M0-5
    public_contract: "Authority resolution + single Verdict Engine (ResolvedAuthority, VerdictPayload)"
    architecture_section: "architecture_build_contract.md §10"
    status: covered
    scenario_ids: [m0.proof.informational, m0.proof.pass, m0.proof.fail, m0.proof.blocked_on_policy]
    checker_families: [scorecard, authority, exit]
    required_command: egts test-core
    negative_control: "A checker that derives the verdict from metric values must fail meta-test review."

  - product_ticket: EG-M0-6
    public_contract: "Pure core engine emits honest RunRecord + Scorecard from fixture and trace-shaped examples"
    architecture_section: "architecture_build_contract.md §7 (engine.py)"
    status: covered
    scenario_ids: [m0.proof.runrecord_round_trips, m0.meta.core_is_effect_free]
    checker_families: [runrecord, scorecard, contract]
    required_command: egts test-core
    negative_control: "Core performing filesystem/network/subprocess/clock access must fail the no-effect check."
