# EGTS coverage registry — EG-M2 (Replay, Baselines, CI).
#
# Every obligation is `covered` only because a real EGTS-M2 scenario drives the
# product's public surface (tests/egts/suites/test_m2_* and the real CLI). A row
# may never be `covered` without a real scenario id — that is an integrity
# violation (tests/CLAUDE.md §14).
rows:
  - product_ticket: EG-M2-1
    public_contract: "Subprocess TaskRunner: JSON in/out, timeout, failure -> typed evidence"
    architecture_section: "architecture_build_contract.md §8 (ports.TaskRunner, task_subprocess)"
    status: covered
    scenario_ids:
      - m2.replay.good_scores_via_subprocess
      - m2.replay.missing_output_blocks
      - m2.replay.malformed_output_blocks
      - m2.replay.nonzero_exit_blocks
      - m2.replay.timeout_blocks
    checker_families: [scorecard, exit, ledger]
    required_command: egts test-trust-runtime
    negative_control: "Output supplied in-process (no subprocess) fails the route-fidelity check."

  - product_ticket: EG-M2-2
    public_contract: "Baseline records + comparable-run checks; explicit promotion"
    architecture_section: "architecture.md §9 (harness/baseline.py); core comparability"
    status: covered
    scenario_ids:
      - m2.baseline.comparable_allows_gate
      - m2.baseline.changed_dataset_not_comparable_blocks
      - m2.baseline.changed_evaluator_not_comparable
      - m2.baseline.missing_blocks
      - m2.baseline.explicit_promotion_only
    checker_families: [provenance, scorecard, authority]
    required_command: egts test-trust-runtime
    negative_control: "A score delta without a comparable fingerprint fails the regression check."

  - product_ticket: EG-M2-3
    public_contract: "Core verdict payload -> CI annotations + exit codes (no second verdict path)"
    architecture_section: "architecture_build_contract.md §8/§10 (exits.py, ci_annotation_sink)"
    status: covered
    scenario_ids:
      - m2.ci.exit_and_annotations_track_verdict
      - m2.ci.infrastructure_error_distinct_exit
    checker_families: [exit, scorecard, report]
    required_command: egts test-trust-runtime
    negative_control: "A test-only exit class disagreeing with the VerdictPayload fails."

  - product_ticket: EG-M2-4
    public_contract: "Data-policy routing before effects + infrastructure-error taxonomy"
    architecture_section: "architecture_build_contract.md §2/§5/§10 (runner egress guard)"
    status: covered
    scenario_ids:
      - m2.policy.forbidden_no_egress_blocks
      - m2.policy.permitted_egresses_and_scores
      - m2.policy.trace_record_override_blocks_egress
    checker_families: [ledger, authority, scorecard]
    required_command: egts test-trust-runtime
    negative_control: "Egress on a forbidden/undeclared source fails the no-egress (ledger) check."

  - product_ticket: EG-M2-5
    public_contract: "Deterministic replay + baseline acceptance scenarios; false-confidence refusal"
    architecture_section: "architecture_build_contract.md §12/§13 (real CLI end-to-end)"
    status: covered
    scenario_ids:
      - m2.acceptance.pass_fail_blocked_informational
      - m2.acceptance.replay_deterministic
      - m2.false_confidence.good_output_without_authority_informational
    checker_families: [scorecard, authority, exit]
    required_command: egts test-trust-runtime
    negative_control: "A setup error reported as a host quality fail fails the exit-taxonomy check."
