# SonarCloud configuration for EvalGlass.
#
# See:
#   - https://docs.sonarsource.com/sonarcloud/digging-deeper/quality-gates/
#   - ADR 0004 (sonarcloud-informational) for the policy stance.

sonar.projectKey=Syntelesis-Lab-evalglass
sonar.organization=syntelesis-lab

# Sources & tests
sonar.sources=src
sonar.tests=tests
sonar.python.version=3.12,3.13

# Coverage report (generated by `pytest --cov --cov-report=xml` in CI)
sonar.python.coverage.reportPaths=coverage.xml

# Issue exclusions — intentional design choices that Sonar should not flag.
# Keep this list short and justified.
sonar.coverage.exclusions=tests/**,tools/**,**/__init__.py
sonar.exclusions=docs/**,tools/**,**/_evalglass/**

# Detect duplicates excluding ADRs/docs (intentionally repetitive), tests (legitimately repetitive
# arrange-act-assert over shared fixtures), and the thin provider-connector adapters. The connectors
# are minimal BaseTraceConnector subclasses (EG-R1..R3): their shared *flow* lives in the base (which
# stays CPD-checked) and their per-provider mapping logic differs — the only residual "duplication"
# CPD sees is the identical import block, which isort forces and which carries no logic.
sonar.cpd.exclusions=adrs/**,docs/**,tests/**,src/evalglass/adapters/trace_langfuse.py,src/evalglass/adapters/trace_phoenix.py,src/evalglass/adapters/trace_langsmith.py
