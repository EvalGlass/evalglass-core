name: License check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: license-check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # NOTE: `actions/dependency-review-action` is intentionally omitted because
  # this is a private repository without GitHub Advanced Security. Add it back
  # when GHAS is enabled — see Phase 1 in the scaffold PR description.

  licensecheck:
    name: licensecheck (declared deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Run licensecheck
        run: |
          uv tool run licensecheck --format ansi | tee licensecheck.txt
      - name: Publish to PR summary
        if: always()
        run: |
          {
            echo "## License check"
            echo ""
            echo '```'
            cat licensecheck.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
