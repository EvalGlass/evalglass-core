name: Dependabot auto-merge

# Enable squash auto-merge for Dependabot PRs that bump non-major versions.
# Major bumps still require human review (and likely an ADR per CLAUDE.md §8).
#
# `main` requires zero approving reviews, so auto-merge lands the PR once the
# required checks pass — no self-approval step is needed, and the repository
# keeps "Allow GitHub Actions to create and approve pull requests" disabled
# (least privilege for the GITHUB_TOKEN).
#
# Uses pull_request_target so the job has write permissions even though the PR
# head is a different branch. It never checks out or executes PR code; the actor
# filter restricts the code path to the official Dependabot bot.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Dependabot non-major auto-merge
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge (non-major)
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "$PR_URL"

      - name: Note major version bumps require human review
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEP_NAMES: ${{ steps.meta.outputs.dependency-names }}
        run: |
          gh pr comment "$PR_URL" --body "Major version bump detected ($DEP_NAMES). Per CLAUDE.md §8, this needs human review and likely an ADR. Not auto-merging."
