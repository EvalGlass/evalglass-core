name: Secret scan

# The `lob` detector (Lob.com postal-mail API) is excluded: EvalGlass has no Lob
# integration, and TruffleHog's Lob verifier is a known false-positive source that
# "verifies" high-entropy hex strings — e.g. the AST-hash and public-surface
# snapshot fixtures under tests/. Excluding it keeps the scan deterministic without
# weakening coverage of any secret this project could actually hold.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC — full-history scan
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  trufflehog:
    name: TruffleHog (verified secrets only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: TruffleHog (PR diff)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@35943b41905eb1195f021955da17c233ed555e24 # v3.84.2
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified --exclude-detectors=lob

      - name: TruffleHog (push diff)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        uses: trufflesecurity/trufflehog@35943b41905eb1195f021955da17c233ed555e24 # v3.84.2
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.event.after }}
          extra_args: --only-verified --exclude-detectors=lob

      - name: TruffleHog (scheduled full scan)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: trufflesecurity/trufflehog@35943b41905eb1195f021955da17c233ed555e24 # v3.84.2
        with:
          path: ./
          extra_args: --only-verified --exclude-detectors=lob
