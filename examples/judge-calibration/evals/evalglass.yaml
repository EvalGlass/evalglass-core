# EvalGlass gallery example: a judge metric + the calibration prerequisite (honest).
#
# INFORMATIONAL BY DESIGN. `judge_score` scores from an LLM-judge rubric. This config even *tries*
# to gate it (metric_status: gating, an approved threshold, validated data) — yet the verdict stays
# INFORMATIONAL, because the judge is UNCALIBRATED. A judge metric cannot gate until the host
# calibrates it (records calibration evidence); that refusal is the point. See the
# `calibrating-a-judge` skill. The non-reference floor gives real signal with no judge and no gold.
#
# Hermetic: the `fake` judge adapter produces deterministic evidence from each example's
# `context.judge` directive — no network, no provider SDK.

run:
  id: judge-calibration

judge:
  adapter: fake            # required-tier deterministic judge; no network, no SDK
  default_value: 0.8       # fallback when an example carries no per-example judge directive

datasets:
  - path: datasets/answers.jsonl
    status: validated       # even with validated gold + an approved threshold…
    data_policy: permitted

metrics:
  # Judge metric (faithfulness). UNCALIBRATED by default → cannot gate, even though this block
  # asks it to (gating + approved threshold). The Verdict Engine refuses honestly.
  - name: faithfulness
    evaluator_ref: judge_score@1
    lens: non_reference
    score_type: continuous
    score_range: [0, 1]
    required_evidence: ["judge"]
    rubric:
      path: rubrics/faithfulness.md
    metric_status: gating
    threshold_approval: approved
    threshold: 0.5
    # NOTE: no `judge_calibration: calibrated` → UNCALIBRATED → informational, never a gate.

  # Non-reference floor: real signal with no judge and no gold.
  - name: field_presence
    evaluator_ref: field_presence@1
    lens: non_reference
    score_type: continuous
    score_range: [0, 1]
    params:
      required_fields: ["answer"]

output:
  dir: reports
