<text x="390" y="176" text-anchor="middle" font-size="17" fill="#54606e">directs</text>
<path d="M 740.0,185.5 Q 770.0,186.1 800.0,185.5" fill="none" stroke="#54606e" stroke-width="2" stroke-linecap="round"/>
<path d="M 800.0,185.5 L 790.8,189.4" fill="none" stroke="#54606e" stroke-width="2" stroke-linecap="round"/>
<path d="M 800.0,185.5 L 789.9,179.9" fill="none" stroke="#54606e" stroke-width="2" stroke-linecap="round"/>
<text x="770" y="176" text-anchor="middle" font-size="17" fill="#54606e">runs</text>
<path d="M 39.1,108.0 Q 198.8,108.3 358.5,107.0 Q 360.8,185.1 360.5,263.1 Q 199.8,262.4 39.1,263.3 Q 39.6,185.7 39.1,108.0 Z" fill="#e9fbee" stroke="#2f9e44" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="200" y="162" text-anchor="middle" font-size="21" font-weight="700" fill="#20242e">You — the host</text>
<text x="200" y="188" text-anchor="middle" font-size="17" fill="#54606e">hold the ground truth:</text>
<text x="200" y="210" text-anchor="middle" font-size="17" fill="#54606e">gold · thresholds · judges</text>
<text x="200" y="232" text-anchor="middle" font-size="17" fill="#54606e">→ you DECIDE &amp; GATE</text>
<path d="M 419.5,106.9 Q 580.5,108.0 741.5,107.5 Q 739.5,184.6 738.7,261.7 Q 579.9,262.4 421.1,263.3 Q 421.5,185.1 419.5,106.9 Z" fill="#e7f5ff" stroke="#1c6fb8" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="580" y="162" text-anchor="middle" font-size="21" font-weight="700" fill="#20242e">Your coding agent</text>
<text x="580" y="188" text-anchor="middle" font-size="17" fill="#54606e">do the work:</text>
<text x="580" y="210" text-anchor="middle" font-size="17" fill="#54606e">scan · scaffold · run · explain</text>
<text x="580" y="232" text-anchor="middle" font-size="17" fill="#54606e">→ OPERATE, never authorize</text>
<path d="M 799.6,108.2 Q 960.3,107.6 1121.1,108.4 Q 1121.7,185.8 1121.2,263.2 Q 960.9,263.5 800.7,261.5 Q 799.4,184.9 799.6,108.2 Z" fill="#f2effe" stroke="#6b46e0" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="960" y="162" text-anchor="middle" font-size="21" font-weight="700" fill="#20242e">EvalGlass</text>
<text x="960" y="188" text-anchor="middle" font-size="17" fill="#54606e">measure the evidence:</text>
<text x="960" y="210" text-anchor="middle" font-size="17" fill="#54606e">scores · provenance · 1 engine</text>
<text x="960" y="232" text-anchor="middle" font-size="17" fill="#54606e">→ MEASURE &amp; REPORT</text>
<text x="40" y="61" font-size="17" font-weight="400" fill="#54606e">You direct → the agent operates → EvalGlass reports → you decide. No step approves its own work.</text>
<text x="40" y="327" font-size="18" font-weight="700" fill="#20242e">Capability is not authority — whatever creates the evidence can never gate on it.</text>
</svg>