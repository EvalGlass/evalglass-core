<text x="1184" y="224" text-anchor="middle" font-size="17" fill="#54606e">+ CI exit code</text>
<text x="40" y="61" font-size="17" font-weight="400" fill="#54606e">Operated by your coding agent — local-first, nothing leaves your repo.</text>
<text x="40" y="285" font-size="16" font-weight="400" fill="#20242e">Green is INFORMATIONAL by default — a metric gates only after you validate gold, approve a</text>
<text x="40" y="307" font-size="16" font-weight="400" fill="#20242e">threshold, and calibrate judges, so a green run never claims more than the evidence earned.</text>
